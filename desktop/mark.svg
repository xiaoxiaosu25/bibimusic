<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="tvGrad" x1="16" y1="22" x2="80" y2="82" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2a2826"/>
      <stop offset="1" stop-color="#181716"/>
    </linearGradient>
    <linearGradient id="eqGrad" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ff80ab"/>
      <stop offset="1" stop-color="#ff6699"/>
    </linearGradient>
  </defs>
  <!-- BiBi Dual TV Antennae -->
  <path d="M36 24L25 11" stroke="#ff6699" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M60 24L71 11" stroke="#ff6699" stroke-width="3.5" stroke-linecap="round"/>
  <!-- TV Monitor Body -->
  <rect x="11" y="22" width="74" height="60" rx="18" fill="url(#tvGrad)" stroke="#ff6699" stroke-width="2.5" stroke-opacity="0.85"/>
  <!-- Screen Inner Bezel -->
  <rect x="16" y="27" width="64" height="50" rx="13" fill="#121110" stroke="#ffffff" stroke-opacity="0.06"/>
  <!-- Soundwave EQ Bars -->
  <rect x="25" y="44" width="4" height="18" rx="2" fill="url(#eqGrad)"/>
  <rect x="35" y="37" width="4" height="32" rx="2" fill="url(#eqGrad)"/>
  <rect x="45" y="41" width="4" height="24" rx="2" fill="url(#eqGrad)"/>
  <rect x="55" y="34" width="4" height="38" rx="2" fill="url(#eqGrad)"/>
  <rect x="65" y="46" width="4" height="14" rx="2" fill="url(#eqGrad)"/>
  <!-- Tuner indicator dot -->
  <circle cx="71" cy="34" r="2" fill="#ff80ab"/>
</svg>
